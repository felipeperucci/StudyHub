<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>StudyHub · Felipe</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:#060610;color:#eee;font-family:'Syne',sans-serif}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#2a2a3e;border-radius:99px}
input,textarea,select,button{font-family:'Syne',sans-serif}
a{color:#C9A84C;text-decoration:none}

/* LAYOUT */
.grid-bg{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#12122011 1px,transparent 1px),linear-gradient(90deg,#12122011 1px,transparent 1px);background-size:36px 36px;z-index:0}
#app{min-height:100vh;padding:24px 18px 60px;position:relative;z-index:1}
.wrap{max-width:680px;margin:0 auto}

/* NAV */
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;cursor:pointer;user-select:none}
.logo em{color:#C9A84C;font-style:normal}
.nav-links{display:flex;gap:6px}
.nav-btn{background:none;border:1px solid #1e1e2e;border-radius:8px;padding:6px 14px;color:#555;font-size:12px;cursor:pointer;transition:all .2s}
.nav-btn:hover,.nav-btn.on{border-color:#C9A84C55;color:#C9A84C;background:#C9A84C0a}

/* CARDS */
.card{background:#0c0c18;border:1px solid #1a1a2e;border-radius:14px;padding:18px;transition:border-color .2s,box-shadow .2s,transform .2s}
.card.click{cursor:pointer}
.card.click:hover{transform:translateY(-2px)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px}

/* XP BAR */
.xpbar{width:100%;height:5px;background:#111122;border-radius:99px;overflow:hidden;margin-top:10px}
.xpfill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.34,1.56,.64,1)}
.xprow{display:flex;justify-content:space-between;margin-top:5px;font-family:monospace;font-size:10px;color:#555}

/* BUTTONS */
.btn{border:none;border-radius:10px;padding:11px 20px;cursor:pointer;font-weight:700;font-size:14px;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{color:#08080f}
.btn-ghost{background:none;border:1px solid #2a2a3e;color:#777;border-radius:10px;padding:9px 16px;cursor:pointer;font-size:13px;transition:all .2s}
.btn-ghost:hover{border-color:#444;color:#bbb}
.btn-danger{background:none;border:1px solid #E05C5C33;color:#E05C5C66;border-radius:10px;padding:9px 16px;cursor:pointer;font-size:13px}
.btn-full{width:100%}
.btn:disabled,.btn-ghost:disabled{opacity:.35;cursor:default}

/* FORMS */
.label{font-size:11px;color:#666;margin-bottom:6px;display:block;font-family:monospace;letter-spacing:.5px;text-transform:uppercase}
.input{width:100%;background:#0e0e1c;border:1px solid #2a2a3e;border-radius:10px;padding:11px 14px;color:#ddd;font-size:13px;outline:none;transition:border-color .2s}
.input:focus{border-color:#C9A84C55}
.textarea{width:100%;background:#0e0e1c;border:1px solid #2a2a3e;border-radius:10px;padding:11px 14px;color:#ddd;font-size:13px;resize:vertical;outline:none;min-height:80px}
.textarea:focus{border-color:#C9A84C55}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.overlay.open{display:flex}
.modal{background:#090914;border-radius:18px;width:100%;max-width:540px;max-height:92vh;overflow-y:auto}
.modal-head{padding:16px 20px;border-bottom:1px solid #ffffff08;display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:20px}
.modal-close{background:none;border:none;color:#444;font-size:22px;cursor:pointer;line-height:1;padding:0}

/* NOTIF */
#notif{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:9px 24px;border-radius:99px;font-family:monospace;font-size:13px;z-index:200;white-space:nowrap;display:none;background:#0c0c18;pointer-events:none}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#notif.show{display:block;animation:fadeUp .3s ease}

/* LOADING */
.loading{min-height:60vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#333;font-family:monospace;font-size:13px}
.spin{width:20px;height:20px;border:2px solid #1e1e2e;border-top-color:#C9A84C;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* QUIZ */
.question{font-weight:700;font-size:15px;line-height:1.7;margin-bottom:20px;color:#eee}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.opt{border-radius:10px;padding:12px 15px;cursor:pointer;text-align:left;font-size:13px;border:1px solid #2a2a3e;background:#0e0e1c;color:#ccc;transition:all .2s;width:100%;font-family:'Syne',sans-serif}
.opt:hover:not(:disabled){background:#ffffff05;border-color:#444}
.opt.sel{color:#fff}
.opt.ok{background:#0f2010!important;border-color:#3a8a3a!important;color:#7dd87d!important}
.opt.fail{background:#20100e!important;border-color:#8a3a3a!important;color:#d87d7d!important}
.feedback{border-radius:12px;padding:16px;margin-top:12px}
.feedback.ok{background:#0f2010;border:1px solid #3a8a3a44}
.feedback.fail{background:#20100e;border:1px solid #8a3a3a44}

/* FLASHCARD */
.fc-wrap{perspective:1000px;height:195px;margin-bottom:16px;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s ease}
.fc-inner.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;justify-content:center;padding:24px}
.fc-back{transform:rotateY(180deg)}
.fc-tag{font-size:10px;font-family:monospace;letter-spacing:1px;margin-bottom:10px}
.fc-title{font-weight:700;font-size:17px;text-align:center;line-height:1.4;color:#eee}
.fc-hint{margin-top:14px;font-size:10px;color:#444;text-align:center}
.fc-text{font-size:14px;line-height:1.8;color:#ddd}

/* SELF EVAL */
.self-eval{display:flex;gap:8px;margin-top:14px}
.eval-btn{flex:1;border:none;border-radius:10px;padding:10px 6px;cursor:pointer;font-size:12px;font-weight:700;font-family:'Syne',sans-serif;transition:all .2s}

/* CHALLENGE */
.scenario{border-radius:12px;padding:16px;margin-bottom:14px}
.tip{background:#15130a;border:1px solid #C9A84C1a;border-radius:10px;padding:9px 13px;margin-bottom:12px;font-size:12px;color:#C9A84C88}
.solution{background:#0e0e1c;border:1px solid #2a2a3e;border-radius:12px;padding:16px}

/* CHAT */
.chat-msgs{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;max-height:360px;overflow-y:auto;padding-right:4px}
.msg{padding:12px 15px;border-radius:12px;font-size:13px;line-height:1.7;max-width:92%}
.msg.user{background:#1a1a2e;color:#ddd;align-self:flex-end;border:1px solid #2a2a4e}
.msg.ai{background:#0e0e1c;color:#ddd;align-self:flex-start;border:1px solid #1e1e2e}
.chat-row{display:flex;gap:8px}
.chat-in{flex:1;background:#0e0e1c;border:1px solid #2a2a3e;border-radius:10px;padding:10px 13px;color:#ddd;font-size:13px;outline:none}
.chat-in:focus{border-color:#C9A84C44}
.chat-send{background:#C9A84C;border:none;border-radius:10px;padding:10px 16px;cursor:pointer;color:#08080f;font-weight:700;font-size:13px}

/* LEARN CHUNKS */
.chunk{background:#0e0e1c;border:1px solid #2a2a3e;border-radius:12px;padding:18px;margin-bottom:12px;font-size:14px;color:#ddd;line-height:1.85}
.chunk h2{color:#eee;font-size:17px;margin:0 0 12px}
.chunk h3{color:#eee;font-size:15px;margin:14px 0 8px}
.chunk strong{color:#eee}
.chunk li{margin:5px 0 5px 18px;color:#ccc}

/* ROADMAP */
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:7px;top:4px;bottom:0;width:1px;background:#1e1e2e}
.tl-item{position:relative;margin-bottom:18px}
.tl-dot{position:absolute;left:-18px;top:5px;width:10px;height:10px;border-radius:50%;border:2px solid #1e1e2e;background:#060610}
.tl-date{font-family:monospace;font-size:10px;color:#555;margin-bottom:4px}
.tl-card{background:#0c0c18;border:1px solid #1a1a2e;border-radius:11px;padding:13px}
.tl-title{font-weight:700;font-size:13px;margin-bottom:3px}
.tl-meta{font-size:12px;color:#666}
.tl-note{font-size:12px;color:#888;margin-top:8px;padding-top:8px;border-top:1px solid #1a1a2e;font-style:italic}

/* STATS */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.stat{background:#0c0c18;border:1px solid #1a1a2e;border-radius:12px;padding:14px;text-align:center}
.stat-n{font-weight:800;font-size:22px;margin-bottom:2px}
.stat-l{font-family:monospace;font-size:10px;color:#555}

/* VOICE */
.voice-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.toggle-track{width:38px;height:21px;border-radius:99px;position:relative;transition:background .2s}
.toggle-thumb{position:absolute;top:2.5px;width:16px;height:16px;border-radius:50%;background:#eee;transition:left .2s}
.mic-status{text-align:center;font-size:12px;color:#888;font-family:monospace;margin-top:8px}

/* XP POPUP */
.xp-popup{position:fixed;bottom:30px;right:24px;background:#0c0c18;border:1px solid #C9A84C44;border-radius:12px;padding:12px 20px;font-family:monospace;font-size:13px;color:#C9A84C;z-index:300;display:none;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* PROGRESS RING */
.ring-wrap{position:relative;width:52px;height:52px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div id="notif"></div>
<div class="xp-popup" id="xp-popup"></div>
<div id="app"></div>

<script>
// ══════════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════════
const TRACKS = [
  {id:"tp",     name:"Transfer Pricing", icon:"⚖️", color:"#C9A84C", active:true,  desc:"Métodos, comparabilidade e regulação OCDE"},
  {id:"sql",    name:"SQL & BI",         icon:"🗄️", color:"#5B8CFF", active:true,  desc:"Consultas, análise e visualização de dados"},
  {id:"es",     name:"Espanhol",         icon:"🌎", color:"#E05C5C", active:true,  desc:"Fluência profissional em espanhol"},
  {id:"italia", name:"Italia",           icon:"🇮🇹", color:"#6CA868", active:true,  desc:"Cultura, história, língua e cidadania", special:"italia"},
  {id:"fr",     name:"Francês",          icon:"🗼", color:"#7B8CDE", active:false, desc:"Em breve"},
  {id:"py",     name:"Programação",      icon:"🐍", color:"#3DB454", active:false, desc:"Em breve"},
  {id:"art",    name:"História da Arte", icon:"🎨", color:"#C47DB4", active:false, desc:"Em breve"},
];

// Períodos históricos da Itália (ordem cronológica)
const HISTORIA_PERIODOS = [
  {id:"roma_antiga",     label:"Roma Antiga",            years:"753 a.C. – 476 d.C.",  icon:"🏛️"},
  {id:"idade_media",     label:"Idade Média",            years:"476 – 1300",            icon:"⚔️"},
  {id:"renascimento",    label:"Renascimento",           years:"1300 – 1600",           icon:"🎨"},
  {id:"estados_italianos",label:"Estados Italianos",    years:"1600 – 1800",           icon:"👑"},
  {id:"risorgimento",    label:"Risorgimento",           years:"1815 – 1871",           icon:"🇮🇹"},
  {id:"italia_unificada",label:"Itália Unificada",      years:"1871 – 1914",           icon:"🏭"},
  {id:"guerras_mundiais",label:"Guerras Mundiais",       years:"1914 – 1945",           icon:"🕊️"},
  {id:"republica",       label:"República Italiana",     years:"1946 – hoje",           icon:"🗳️"},
];

// Italia subcategories
const ITALIA_SUBS = [
  {id:"historia",    icon:"🏛️", name:"História",          desc:"De Roma Antiga à República — fatos, personagens e momentos cruciais", color:"#C9874C", weight:0.30},
  {id:"cultura",     icon:"🎭", name:"Cultura",            desc:"Arte, gastronomia, cinema, moda e identidade regional",              color:"#6CA868", weight:0.25},
  {id:"lingua",      icon:"🗣️", name:"Língua",             desc:"Italiano do zero — vocabulário, gramática e expressões",             color:"#5B8CFF", weight:0.30},
  {id:"cidadania",   icon:"📜", name:"Cidadania & Sociedade", desc:"Política, direitos, a diáspora brasileira e o país hoje",          color:"#C47DB4", weight:0.15},
];

const MODES = [
  {id:"quiz",      icon:"❓", label:"Quiz",           desc:"Pergunta gerada por IA no seu nível",          xpBase:30, practice:true},
  {id:"flashcard", icon:"🃏", label:"Flashcard",       desc:"Conceito + autoavaliação honesta",             xpBase:20, practice:true},
  {id:"challenge", icon:"⚡", label:"Desafio",         desc:"Cenário prático avaliado pela IA",             xpBase:40, practice:true},
  {id:"guide",     icon:"📖", label:"Leitura Guiada",  desc:"Microaula progressiva sobre tópico novo",      xpBase:25, practice:false},
  {id:"socratic",  icon:"🤔", label:"Socrático",       desc:"Diálogo que constrói o entendimento",          xpBase:35, practice:false},
  {id:"doc",       icon:"📄", label:"Chat c/ Documento",desc:"Sobe um texto e discute com a IA",            xpBase:35, practice:false},
  {id:"brief",     icon:"⚡", label:"Daily Brief",     desc:"Conceito novo do dia baseado no seu histórico", xpBase:15, practice:false},
];

const VOICE_MODES = [
  {id:"conv",    icon:"🎙️", label:"Conversação",   desc:"Fale livremente — IA responde e corrige",  xpBase:40},
  {id:"shadow",  icon:"🔊", label:"Shadowing",     desc:"Ouça e repita — treine pronúncia",          xpBase:25},
  {id:"dictado", icon:"✍️", label:"Ditado",        desc:"Ouça e escreva — treine compreensão",       xpBase:30},
];

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
const DEF_STATS = () => ({xp:0,level:1,xpNext:100,streak:0});
let S = {
  page: "home",
  stats: {tp:DEF_STATS(),sql:DEF_STATS(),es:DEF_STATS(),historia:DEF_STATS(),cultura:DEF_STATS(),lingua:DEF_STATS(),cidadania:DEF_STATS(),italia:DEF_STATS()},
  totalXP: 0,
  history: [],        // {date,trackId,mode,topic,xp,score,note}
  seen: {},           // {trackId: [{topic,date}]} — spaced repetition memory
  // session
  track: null,
  mode: null,
  item: null,
  // quiz state
  qSel: null, qRevealed: false,
  // flashcard state
  fcFlipped: false,
  // challenge state
  chAnswer: "", chRevealed: false, chScore: null, chFeedback: "",
  // chat state
  chatHist: [],
  // guide state
  chunks: [], chunkIdx: 0,
  // doc state
  docText: "",
  // voice state
  voiceMode: null, vManual: false, vListening: false,
  vTranscript: "", vShadowPhrase: "", vDictadoPhrase: "",
  vConvHist: [],
  // italia
  italiaSub: null,
  historiaPeriodo: null, // selected period for history
  cadernoInput: "", // current note being typed
  cadernoFilter: null,
  cadernoSearch: "",
  editingNoteIdx: null,
  notesFocus: 50,  // 0=explorar, 50=balanceado, 100=focar nas notas
  notes: [],       // caderno notes
  // misc
  analysisText: "", analysisLoading: false,
  loaded: false,
};

// ══════════════════════════════════════════════
// STORAGE — GitHub + localStorage fallback
// ══════════════════════════════════════════════
const gl = k => { try{return localStorage.getItem(k)}catch{return null} };
const sl = (k,v) => { try{localStorage.setItem(k,v)}catch{} };

function getKeys(){
  return {
    gemini: gl("sh_gemini")||"",
    groq:   gl("sh_groq")||"",
    github: gl("sh_github")||"",
    repo:   gl("sh_repo")||"felipeperucci/studyhub",
  };
}

let _ghSha = null;
async function ghRead(){
  const {github,repo} = getKeys();
  if(!github) return null;
  try{
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/data.json`,{
      headers:{Authorization:`token ${github}`,Accept:"application/vnd.github.v3+json"}
    });
    if(!r.ok) return null;
    const j = await r.json();
    return {data:JSON.parse(decodeURIComponent(escape(atob(j.content)))), sha:j.sha};
  }catch{return null}
}
async function ghWrite(data,sha){
  const {github,repo} = getKeys();
  if(!github) return false;
  try{
    const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
    const body = {message:"StudyHub sync",content:encoded};
    if(sha) body.sha = sha;
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/data.json`,{
      method:"PUT",
      headers:{Authorization:`token ${github}`,Accept:"application/vnd.github.v3+json","Content-Type":"application/json"},
      body:JSON.stringify(body)
    });
    return r.ok;
  }catch{return false}
}
async function loadData(){
  const gh = await ghRead();
  if(gh){
    _ghSha = gh.sha;
    applyData(gh.data);
    return;
  }
  const local = gl("sh_data");
  if(local) try{ applyData(JSON.parse(local)); }catch{}
}
function applyData(d){
  if(d.stats) S.stats = d.stats;
  if(typeof d.totalXP==="number") S.totalXP = d.totalXP;
  if(d.history) S.history = d.history;
  if(d.seen) S.seen = d.seen;
  // Ensure all known track/sub ids have stats initialized
  if(d.notes) S.notes=d.notes; else if(!S.notes) S.notes=[];
  if(d.notesFocus!==undefined) S.notesFocus=d.notesFocus;
  const allIds=["tp","sql","es","historia","cultura","lingua","cidadania","italia"];
  allIds.forEach(id=>{ if(!S.stats[id]) S.stats[id]=DEF_STATS(); });
}
async function saveData(){
  const data = {stats:S.stats,totalXP:S.totalXP,history:S.history,seen:S.seen,notes:S.notes||[],notesFocus:S.notesFocus||50};
  sl("sh_data",JSON.stringify(data));
  const ok = await ghWrite(data,_ghSha);
  if(ok){ const gh=await ghRead(); if(gh) _ghSha=gh.sha; }
}

// ══════════════════════════════════════════════
// AI — Gemini + Groq fallback
// ══════════════════════════════════════════════
async function callGemini(messages,system,maxTokens){
  const {gemini}=getKeys();
  if(!gemini) throw new Error("Gemini não configurado");
  const raw=messages.map(m=>({role:m.role==="assistant"?"model":"user",text:m.content}));
  const merged=[];
  for(const m of raw){
    if(merged.length&&merged[merged.length-1].role===m.role) merged[merged.length-1].text+="\n"+m.text;
    else merged.push({role:m.role,text:m.text});
  }
  if(!merged.length||merged[0].role!=="user") merged.unshift({role:"user",text:"Olá"});
  const body={contents:merged.map(m=>({role:m.role,parts:[{text:m.text}]})),generationConfig:{maxOutputTokens:maxTokens,temperature:0.7}};
  if(system) body.systemInstruction={parts:[{text:system}]};
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",{
    method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":gemini},body:JSON.stringify(body)
  });
  const j=await r.json();
  if(j.error) throw new Error("Gemini: "+j.error.message);
  return j.candidates?.[0]?.content?.parts?.[0]?.text||"";
}
async function callGroq(messages,system,maxTokens){
  const {groq}=getKeys();
  if(!groq) throw new Error("Groq não configurado");
  const msgs=[];
  if(system) msgs.push({role:"system",content:system});
  messages.forEach(m=>msgs.push({role:m.role==="assistant"?"assistant":"user",content:m.content}));
  const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+groq},
    body:JSON.stringify({model:"llama-3.3-70b-versatile",messages:msgs,max_tokens:maxTokens,temperature:0.7})
  });
  const j=await r.json();
  if(j.error) throw new Error("Groq: "+(j.error.message||JSON.stringify(j.error)));
  return j.choices?.[0]?.message?.content||"";
}
async function ai(messages,system="",maxTokens=4000){
  const {gemini,groq}=getKeys();
  if(!gemini&&!groq) throw new Error("Nenhuma API key configurada. Vá em Configurações.");
  if(gemini){
    try{ return await callGemini(messages,system,maxTokens); }
    catch(e){
      const msg=e.message||"";
      if(groq&&(msg.includes("quota")||msg.includes("429")||msg.includes("RESOURCE_EXHAUSTED")||msg.includes("demand")||msg.includes("rate")||msg.includes("limit"))){
        notif("Gemini indisponível — usando Groq 🔄","#C9A84C");
        return await callGroq(messages,system,maxTokens);
      }
      throw e;
    }
  }
  return await callGroq(messages,system,maxTokens);
}
function hasAI(){ return !!(gl("sh_gemini")||gl("sh_groq")); }

// ══════════════════════════════════════════════
// SPACED REPETITION
// ══════════════════════════════════════════════
function getSeenTopics(trackId){
  const seen = S.seen[trackId]||[];
  const now = Date.now();
  // Topics seen in last 7 days
  return seen.filter(t=>now-new Date(t.date).getTime()<7*24*60*60*1000).map(t=>t.topic);
}
function recordTopic(trackId,topic){
  if(!S.seen[trackId]) S.seen[trackId]=[];
  // Remove if already there, re-add with new date
  S.seen[trackId]=S.seen[trackId].filter(t=>t.topic!==topic);
  S.seen[trackId].push({topic,date:new Date().toISOString()});
  // Keep last 100
  if(S.seen[trackId].length>100) S.seen[trackId]=S.seen[trackId].slice(-100);
}
function buildMemoryContext(trackId){
  const seen = getSeenTopics(trackId);
  const recentNotes = (S.history||[]).filter(h=>h.trackId===trackId&&h.note).slice(0,5).map(h=>h.note);
  const weakTopics = (S.history||[]).filter(h=>h.trackId===trackId&&h.score!==undefined&&h.score<60).slice(0,5).map(h=>h.topic).filter(Boolean);
  const level = S.stats[trackId]?.level||1;
  const focus = S.notesFocus||50;

  // Caderno notes for this track (or general)
  const cadernoNotes=(S.notes||[]).filter(n=>!n.trackId||n.trackId===trackId).slice(0,5).map(n=>n.text);

  const parts = [`Nível do aluno: ${level}/10`];
  if(seen.length) parts.push(`Tópicos vistos recentemente (NÃO repita): ${seen.join(", ")}`);
  if(weakTopics.length) parts.push(`Tópicos com dificuldade (pode reforçar): ${weakTopics.join(", ")}`);
  if(recentNotes.length) parts.push(`Anotações de sessões: ${recentNotes.join(" | ")}`);

  if(cadernoNotes.length){
    if(focus===0){
      parts.push(`[Caderno do aluno — IGNORAR para seleção de conteúdo]: ${cadernoNotes.join(" | ")}`);
    } else if(focus<=40){
      parts.push(`[Caderno do aluno — considere levemente]: ${cadernoNotes.join(" | ")}`);
    } else if(focus<=70){
      parts.push(`[Caderno do aluno — considere junto com outros critérios]: ${cadernoNotes.join(" | ")}`);
    } else {
      parts.push(`[Caderno do aluno — PRIORIZE estes pontos mas varie o conteúdo]: ${cadernoNotes.join(" | ")}`);
    }
  }
  return parts.join("\n");
}

function trackById(id){ return TRACKS.find(t=>t.id===id); }
function modeById(id){ return [...MODES,...VOICE_MODES].find(m=>m.id===id); }
function fmt(n){ return n.toLocaleString("pt-BR"); }
function fmtDate(iso){
  const d=new Date(iso);
  return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
}
function totalLevel(){ return Object.values(S.stats).reduce((s,t)=>s+t.level,0); }
// Activity tracker: sessions per day (last 35 days)
function getActivityData(){
  const days={};
  const now=new Date();
  for(let i=34;i>=0;i--){
    const d=new Date(now-i*86400000).toISOString().slice(0,10);
    days[d]=0;
  }
  (S.history||[]).forEach(h=>{
    const d=h.date?.slice(0,10);
    if(d&&days[d]!==undefined) days[d]++;
  });
  return days;
}

// Calculate global daily streak (any track)
function globalStreak(){
  const today=new Date().toISOString().slice(0,10);
  const days=new Set((S.history||[]).map(h=>h.date?.slice(0,10)).filter(Boolean));
  let streak=0;
  let check=new Date();
  // if no session today, start from yesterday
  if(!days.has(today)) check=new Date(Date.now()-86400000);
  while(true){
    const d=check.toISOString().slice(0,10);
    if(!days.has(d)) break;
    streak++;
    check=new Date(check-86400000);
  }
  return streak;
}

function italiaScore(){
  return ITALIA_SUBS.reduce((sum,sub)=>{
    const s=S.stats[sub.id]||DEF_STATS();
    const pct=Math.min((s.xp/s.xpNext)*100,100);
    return sum + pct*sub.weight;
  },0);
}
function h(color,a){ return color+Math.round(a*255).toString(16).padStart(2,"0"); }

function mdToHtml(text){
  return (text||"")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\*([^*\n]+)\*/g,"<em>$1</em>")
    .replace(/^### (.+)$/gm,"<h3>$1</h3>")
    .replace(/^## (.+)$/gm,"<h2>$1</h2>")
    .replace(/^- (.+)$/gm,"<li>$1</li>")
    .replace(/(<li>[\s\S]*?<\/li>)/g,"<ul>$1</ul>")
    .replace(/\n{2,}/g,"</p><p>")
    .replace(/\n/g,"<br>");
}

function parseAIText(text,type){
  const get=(...keys)=>{
    for(const key of keys){
      // Try line-by-line first (more robust)
      const lines=text.split("\n");
      let result=""; let capturing=false;
      for(const line of lines){
        const headerMatch=line.match(new RegExp("^"+key+"\\s*:(.*)","i"));
        if(headerMatch){ result=headerMatch[1].trim(); capturing=true; continue; }
        if(capturing){
          if(/^[A-ZÁÉÍÓÚÀÂÊÔÃÕÜ_]{3,}\s*:/.test(line)) break; // next key
          if(/^[A-D]\)/.test(line)) break; // option line
          result+=" "+line.trim();
        }
      }
      if(result.trim()) return result.trim();
    }
    return "";
  };
  if(type==="quiz"){
    const opts=[];
    ["A","B","C","D"].forEach(l=>{
      const m=text.match(new RegExp("^"+l+"\\)(.+)$","m"));
      if(m) opts.push(l+") "+m[1].trim());
    });
    let q=get("PERGUNTA","QUESTÃO","QUESTAO").replace(/\*\*/g,"").trim();
    // Strip any options that leaked into the question
    q=q.replace(/\n?[A-D]\).*$/gm,"").trim();
    const exp=get("EXPLICAÇÃO","EXPLICACAO").replace(/\*\*/g,"").trim();
    return {q,opts,ans:get("RESPOSTA","GABARITO").trim().toUpperCase().charAt(0),exp};
  }
  if(type==="challenge"){
    const clean=s=>(s||"").replace(/\*\*/g,"").replace(/\*/g,"").trim();
    return {
      title:clean(get("TÍTULO","TITULO")),
      scenario:clean(get("CENÁRIO","CENARIO")),
      task:clean(get("TAREFA")),
      hint:clean(get("DICA")),
      solution:clean(get("SOLUÇÃO","SOLUCAO"))
    };
  }
  return {};
}

// ══════════════════════════════════════════════
// XP SYSTEM — quality-based
// ══════════════════════════════════════════════
function calcXP(mode,score){
  const base=modeById(mode)?.xpBase||20;
  if(score===undefined||score===null||isNaN(score)) return base;
  return Math.max(1,Math.round(base*(score/100)));
}
async function completeSession(score,note=""){
  const t=S.track; const m=S.mode;
  if(!t||!m){ notif("Erro: sessão inválida","#E05C5C"); return; }
  const xp=calcXP(m,score);
  const topic=S.item?.title||S.item?.front||S.item?.q?.slice(0,50)||m;

  // Record topic for spaced repetition
  if(topic&&t) recordTopic(t.id,topic);

  // Update stats
  if(!S.stats[t.id]) S.stats[t.id]=DEF_STATS();
  const s=S.stats[t.id];
  const newXP=s.xp+xp;
  const leveled=newXP>=s.xpNext;
  // Streak: count consecutive DAYS, not sessions
  const today=new Date().toISOString().slice(0,10);
  const lastSession=(S.history||[]).find(h=>h.trackId===t.id);
  const lastDay=lastSession?.date?.slice(0,10);
  const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
  let newStreak=s.streak;
  if(lastDay===today) newStreak=s.streak; // same day: don't increment
  else if(lastDay===yesterday) newStreak=s.streak+1; // consecutive: increment
  else newStreak=1; // gap or first time: reset to 1
  S.stats[t.id]={xp:leveled?newXP-s.xpNext:newXP,level:leveled?s.level+1:s.level,xpNext:leveled?Math.round(s.xpNext*1.5):s.xpNext,streak:newStreak};
  S.totalXP+=xp;

  // Log
  S.history.unshift({date:new Date().toISOString(),trackId:t.id,trackName:t.name,mode:m,topic,xp,score,note});
  // Also save inline note to caderno if non-empty
  if(note.trim()){ if(!S.notes) S.notes=[]; S.notes.unshift({date:new Date().toISOString(),trackId:t.id,trackName:t.name,text:note,source:"sessão"}); }
  if(S.history.length>200) S.history=S.history.slice(0,200);

  await saveData();
  showXP(xp, score!==undefined?`${score}/100`:undefined);
  if(leveled) setTimeout(()=>notif(`🎉 Level up! ${t.name} → Nível ${S.stats[t.id].level}`,"#C9A84C"),600);

  // Reset session
  const wasItalia=["historia","cultura","lingua","cidadania"].includes(t.id);
  const prevSubId=t.id;
  resetSession();
  if(wasItalia){ S.track=trackById("italia"); S.italiaSub=prevSubId; go("italia"); }
  else go("track");
}
function resetSession(){
  S.mode=null; S.item=null; S.qSel=null; S.qRevealed=false;
  S.fcFlipped=false; S.chAnswer=""; S.chRevealed=false; S.chScore=null; S.chFeedback="";
  S.chatHist=[]; S.chunks=[]; S.chunkIdx=0; S.docText="";
  S.voiceMode=null; S.vListening=false; S.vTranscript=""; S.vShadowPhrase=""; S.vDictadoPhrase=""; S.vConvHist=[];
  // don't reset historiaPeriodo — keep selection between sessions
}

async function startMode(modeId){
  if(!hasAI()){ notif("Configure uma API key em Configurações","#E05C5C"); return; }
  S.mode=modeId; S.item=null; S.qSel=null; S.qRevealed=false; S.fcFlipped=false;
  S.chAnswer=""; S.chRevealed=false; S.chScore=null; S.chFeedback="";
  S.chatHist=[]; S.chunks=[]; S.chunkIdx=0;
  S.page="session";
  render(); // show loading

  const t=S.track;
  const ctx=buildMemoryContext(t.id);
  const italiaCtx=["historia","cultura","lingua","cidadania"].includes(t.id);
  const italiaSubInfo=italiaCtx?ITALIA_SUBS.find(s=>s.id===t.id):null;
  const italiaTheme=italiaCtx?italiaSubInfo?.name:"";
  const periodoInfo=t.id==="historia"&&S.historiaPeriodo?HISTORIA_PERIODOS.find(p=>p.id===S.historiaPeriodo):null;
  const periodoCtx=periodoInfo?`\nFoco no período: ${periodoInfo.label} (${periodoInfo.years}). Crie conteúdo EXCLUSIVAMENTE sobre este período histórico da Itália.`:"";
  const italiaSys=italiaCtx?`Você é um tutor especializado em ${italiaSubInfo?.name} da Itália. Ensine Felipe, brasileiro com cidadania italiana. IMPORTANTE: todo conteúdo deve ser exclusivamente sobre a ITÁLIA — o país europeu. A palavra "Italia" refere-se ao país, não a uma pessoa. ${italiaSubInfo?.desc}. Não crie conteúdo genérico ou sobre outros países.${periodoCtx}`:"";

  try{
    if(modeId==="quiz"){
      const temas=["A","B","C","D"].join("|");
      const raw=await ai([{role:"user",content:`Você é tutor de ${italiaTheme||t.name}. Crie uma pergunta de múltipla escolha NOVA e ESPECÍFICA — nunca um conceito básico óbvio.

${ctx}

Responda EXATAMENTE neste formato, cada item em sua própria linha, sem texto adicional:
PERGUNTA: [apenas o enunciado da pergunta, SEM incluir as alternativas]
A) [texto da alternativa A]
B) [texto da alternativa B]
C) [texto da alternativa C]
D) [texto da alternativa D]
RESPOSTA: [apenas a letra, ex: B]
EXPLICAÇÃO: [explicação de 2-3 frases sobre por que a resposta está correta]`}],italiaSys);
      S.item=parseAIText(raw,"quiz");
      if(!S.item.q||!S.item.opts?.length) throw new Error("Formato inválido");
      if(S.item.q) recordTopic(t.id, S.item.q.slice(0,60));

    } else if(modeId==="flashcard"){
      const raw=await ai([{role:"user",content:`Você é tutor de ${italiaTheme||t.name}. Crie um flashcard sobre um conceito ESPECÍFICO e útil.

${ctx}

Responda EXATAMENTE assim, com cada campo em sua própria linha, sem texto adicional antes ou depois:
CONCEITO: [apenas o nome do conceito aqui, nada mais]
EXPLICAÇÃO: [apenas a explicação aqui, 3-5 frases]
DICA: [apenas a dica aqui, 1 frase]`}],italiaSys);
      // More robust flashcard parser
      const lines = raw.split("\n");
      const fc = {front:"", back:"", tip:""};
      let cur = null;
      for(const line of lines){
        if(/^CONCEITO:/i.test(line)){ cur="front"; fc.front=line.replace(/^CONCEITO:\s*/i,"").trim(); }
        else if(/^EXPLICAÇ[AÃ]O:/i.test(line)||/^EXPLICACAO:/i.test(line)){ cur="back"; fc.back=line.replace(/^EXPLICAÇ[AÃ]O:\s*/i,"").replace(/^EXPLICACAO:\s*/i,"").trim(); }
        else if(/^DICA:/i.test(line)){ cur="tip"; fc.tip=line.replace(/^DICA:\s*/i,"").trim(); }
        else if(cur&&line.trim()){ fc[cur]+=" "+line.trim(); }
      }
      // Strip markdown artifacts from front (concept name only)
      fc.front = fc.front.replace(/\*\*/g,"").replace(/EXPLICAÇ[AÃ]O:.*/i,"").replace(/EXPLICACAO:.*/i,"").trim();
      S.item = fc;
      if(!S.item.front) throw new Error("Formato inválido");
      if(S.item.front) recordTopic(t.id, S.item.front);

    } else if(modeId==="challenge"){
      const raw=await ai([{role:"user",content:`Você é tutor de ${italiaTheme||t.name}. Crie um desafio prático REALISTA e ESPECÍFICO.

${ctx}

Formato OBRIGATÓRIO:
TÍTULO: [título curto]
CENÁRIO: [descrição do cenário em 3-5 frases]
TAREFA: [o que o aluno deve fazer]
DICA: [uma dica útil]
SOLUÇÃO: [solução detalhada e didática]`}],italiaSys);
      S.item=parseAIText(raw,"challenge");
      if(!S.item.title) throw new Error("Formato inválido");
      if(S.item.title) recordTopic(t.id, S.item.title);

    } else if(modeId==="guide"){
      const text=await ai([{role:"user",content:`Crie uma microaula sobre um tópico NOVO e ESPECÍFICO de ${italiaTheme||t.name}.

${ctx}

Estruture em 4 blocos separados por ---BLOCO---:
## 1. Contexto
[por que isso importa, onde aparece na prática]

---BLOCO---

## 2. O Conceito
[explicação clara com definição precisa]

---BLOCO---

## 3. Exemplo Prático
[exemplo real do ambiente profissional]

---BLOCO---

## 4. Para Fixar
[3 pontos-chave para lembrar]`}],italiaSys,4000);
      S.chunks=text.split("---BLOCO---").map(s=>s.trim()).filter(Boolean);
      S.chunkIdx=0;
      const guideTitle=S.chunks[0]?.match(/##[^\n]+/)?.[0]?.replace(/##\s*/,"")?.trim();
      if(guideTitle) recordTopic(t.id, guideTitle);

    } else if(modeId==="brief"){
      const text=await ai([{role:"user",content:`Escreva um daily brief sobre um conceito NOVO de ${italiaTheme||t.name} — algo que o aluno ainda não viu ou que vale reforçar.

${ctx}

Estrutura:
1. **O conceito de hoje** — nome e contexto
2. **Como funciona** — explicação direta
3. **Exemplo prático** — situação real
4. **Por que importa** — relevância profissional

Seja específico, direto e útil. Não use introduções genéricas.`}],italiaSys,5000);
      S.chunks=[text]; S.chunkIdx=0;

    } else if(modeId==="socratic"){
      const first=await ai([{role:"user",content:`Conduza um diálogo socrático sobre ${italiaTheme||t.name}.

${ctx}

Faça a primeira pergunta aberta — explore o que o aluno sabe sobre um tópico que ele ainda não viu recentemente. Seja direto e estimulante.`}],italiaSys,2000);
      S.chatHist=[{role:"ai",text:first}];

    } else if(modeId==="doc"){
      // Doc mode starts with upload UI — no AI call needed
    }

    render();
  } catch(e){
    notif(e.message,"#E05C5C");
    S.page="track"; render();
  }
}

// ── QUIZ ──
function renderQuiz(){
  const t=S.track; const item=S.item;
  if(!item) return `<div class="loading"><div class="spin"></div>Gerando questão com IA...</div>`;
  return `
    <div class="question">${item.q}</div>
    <div class="opts">
      ${(item.opts||[]).map(opt=>{
        const l=opt[0]; const isAns=l===item.ans; const isSel=l===S.qSel;
        let cls="opt",style="";
        if(S.qRevealed){ if(isAns)cls+=" ok"; else if(isSel)cls+=" fail"; }
        else if(isSel){ cls+=" sel"; style=`background:${h(t.color,.1)};border-color:${t.color};color:#fff`; }
        return `<button class="${cls}" style="${style}" onclick="selectOpt('${l}')" ${S.qRevealed?"disabled":""}>${opt}</button>`;
      }).join("")}
    </div>
    ${!S.qRevealed&&S.qSel?`<button class="btn btn-primary btn-full" style="background:${t.color}" onclick="revealQuiz()">Confirmar</button>`:""}
    ${S.qRevealed?`
      <div class="feedback ${S.qSel===item.ans?"ok":"fail"}">
        <div style="font-weight:700;color:${S.qSel===item.ans?"#7dd87d":"#d87d7d"};margin-bottom:8px">
          ${S.qSel===item.ans?"✓ Correto!":"✗ Incorreto — resp.: "+item.ans}
        </div>
        <div style="color:#bbb;font-size:13px;line-height:1.7;margin-bottom:16px">${item.exp||""}</div>
        ${renderNoteAndComplete(S.qSel===item.ans?100:20,t)}
      </div>`:""}`;
}
function selectOpt(l){ if(!S.qRevealed){S.qSel=l;render();} }
function revealQuiz(){ S.qRevealed=true; render(); }

function renderRing(score,color){
  const r=22; const circ=2*Math.PI*r; const dash=circ*(score/100);
  return `<div class="ring-wrap">
    <svg width="52" height="52" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="${r}" fill="none" stroke="#1e1e2e" stroke-width="4"/>
      <circle cx="26" cy="26" r="${r}" fill="none" stroke="${color}" stroke-width="4" stroke-dasharray="${dash} ${circ}" stroke-linecap="round"/>
    </svg>
    <div class="ring-label" style="color:${color}">${score}</div>
  </div>`;
}

Desafio: ${S.item.scenario} — ${S.item.task}
Solução de referência: ${S.item.solution}
Resposta do aluno: ${ans}

Dê uma nota de 0 a 100 e um feedback de 2-3 frases. Formato:

function renderNoteAndComplete(score,t){
  // Use -1 as sentinel for "no score" (learn modes)
  // Cannot pass undefined through HTML onclick attributes
  const hasScore=(score!==undefined&&score!==null&&!isNaN(score));
  const sentinel=hasScore?score:-1;
  const xp=calcXP(S.mode,hasScore?score:undefined);
  return `${renderNoteField()}
    <button class="btn btn-primary btn-full" style="background:${t.color};margin-top:10px" onclick="finishSession(${sentinel})">
      +${xp} XP — Concluir sessão
    </button>`;
}
function finishSession(sentinel){
  const note=document.getElementById("sess-note")?.value||"";
  const score=sentinel===-1?undefined:sentinel;
  completeSession(score,note);
}

function startVoice(modeId){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ notif("Voz não suportada — use o Chrome","#E05C5C"); return; }
  S.voiceMode=modeId; S.vListening=false; S.vTranscript=""; S.vShadowPhrase=""; S.vDictadoPhrase=""; S.vConvHist=[];
  S.page="session"; S.mode="voice_"+modeId;
  render();
  if(modeId==="shadow") loadShadowPhrase();
  if(modeId==="dictado") loadDictadoPhrase();
  if(modeId==="conv") initConv();
}

function speak(text,onEnd,lang){
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang||(S.track?.voiceLang)||"es-ES"; u.rate=0.88; u.pitch=1;
  if(onEnd) u.onend=onEnd;
  window.speechSynthesis.speak(u);
}
function speakPhrase(type){ speak(type==="shadow"?S.vShadowPhrase:S.vDictadoPhrase); }

let _rec=null;
function startListen(onResult,onEnd){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  _rec=new SR(); _rec.lang=(S.track?.voiceLang)||"es-ES"; _rec.interimResults=false;
  if(S.vManual){
    _rec.continuous=true; let acc="";
    _rec.onresult=e=>{ for(let i=e.resultIndex;i<e.results.length;i++) if(e.results[i].isFinal) acc+=e.results[i][0].transcript+" "; };
    _rec.onend=()=>{ S.vListening=false; if(onEnd) onEnd(); if(acc.trim()) onResult(acc.trim()); };
  } else {
    _rec.continuous=false;
    _rec.onresult=e=>{ onResult(e.results[0][0].transcript); };
    _rec.onend=()=>{ S.vListening=false; if(onEnd) onEnd(); };
  }
  _rec.onerror=e=>{ if(e.error!=="no-speech") notif("Microfone: "+e.error,"#E05C5C"); S.vListening=false; if(onEnd) onEnd(); render(); };
  _rec.start(); S.vListening=true;
}
function stopListen(){ try{_rec?.stop();}catch{} }

    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px">
      <div style="padding:5px 12px;border-radius:8px;font-size:12px;cursor:pointer;border:1px solid ${!S.cadernoFilter?"#C9A84C":"#2a2a3e"};background:${!S.cadernoFilter?"#C9A84C18":"#0e0e1c"};color:${!S.cadernoFilter?"#C9A84C":"#666"}"
        onclick="S.cadernoFilter=null;render()">Todas</div>
      ${[...new Set(notes.map(n=>n.trackId).filter(Boolean))].map(tid=>{
        const t=allTracks.find(t=>t.id===tid)||{name:tid,icon:"📝"};
        return `<div style="padding:5px 12px;border-radius:8px;font-size:12px;cursor:pointer;border:1px solid ${S.cadernoFilter===tid?"#C9A84C":"#2a2a3e"};background:${S.cadernoFilter===tid?"#C9A84C18":"#0e0e1c"};color:${S.cadernoFilter===tid?"#C9A84C":"#666"}"
          onclick="S.cadernoFilter='${tid}';render()">${t.icon||""} ${t.name}</div>`;
      }).join("")}
    </div>`:""}

    <!-- Notes list -->
    ${filtered.length===0
      ?`<div style="text-align:center;color:#333;font-size:13px;padding:40px">${notes.length===0?"Nenhuma anotação ainda. Escreva acima!":"Nenhuma anotação encontrada."}</div>`
      :`<div style="display:flex;flex-direction:column;gap:10px">
        ${filtered.map((note)=>{
          const t=allTracks.find(t=>t.id===note.trackId);
          const realIdx=notes.indexOf(note);
          const isEditing=S.editingNoteIdx===realIdx;
          const q=S.cadernoSearch?.toLowerCase();
          const highlighted=q?note.text.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark style="background:#C9A84C33;color:#C9A84C;border-radius:3px">${m}</mark>`):note.text;
          return `<div class="card" style="border-color:${isEditing?"#C9A84C55":"#1a1a2e"}">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
              <div style="font-size:11px;font-family:monospace;color:#555">
                ${fmtDate(note.date)}
                ${t?`<span style="margin-left:8px;color:#777">${t.icon||""} ${t.name}</span>`:""}
                ${note.source==="sessão"?`<span style="margin-left:8px;color:#444">· de sessão</span>`:""}
              </div>
              <div style="display:flex;gap:8px">
                <button onclick="startEditNote(${realIdx})" style="background:none;border:none;color:#555;cursor:pointer;font-size:13px;padding:0" title="Editar">✏️</button>
                <button onclick="deleteNote(${realIdx})" style="background:none;border:none;color:#333;cursor:pointer;font-size:16px;line-height:1;padding:0" title="Excluir">×</button>
              </div>
            </div>
            ${isEditing?`
              <textarea class="textarea" id="edit-note-${realIdx}" style="min-height:80px;margin-bottom:8px">${note.text}</textarea>
              <div style="display:flex;gap:8px">
                <button class="btn btn-primary" style="background:#C9A84C;flex:1" onclick="saveEditNote(${realIdx})">Salvar</button>
                <button class="btn-ghost" onclick="S.editingNoteIdx=null;render()">Cancelar</button>
              </div>
            `:`<div style="color:#ccc;font-size:14px;line-height:1.7;white-space:pre-wrap">${highlighted}</div>`}
          </div>`;
        }).join("")}
      </div>`}`;
}

function saveNote(){
  const text=document.getElementById("note-input")?.value?.trim();
  const trackId=document.getElementById("note-track")?.value||null;
  if(!text){ notif("Escreva algo antes de salvar","#E05C5C"); return; }
  if(!S.notes) S.notes=[];
  const trackInfo=[...TRACKS,...ITALIA_SUBS].find(t=>t.id===trackId);
  S.notes.unshift({
    date:new Date().toISOString(),
    trackId:trackId||null,
    trackName:trackInfo?.name||null,
    text,
    source:"caderno"
  });
  S.cadernoInput="";
  saveData();
  notif("Anotação salva ✓");
  render();
}

function deleteNote(idx){
  if(!confirm("Excluir esta anotação?")) return;
  S.notes.splice(idx,1);
  saveData();
  render();
}
function startEditNote(idx){
  S.editingNoteIdx=idx;
  render();
  // Focus textarea after render
  setTimeout(()=>document.getElementById("edit-note-"+idx)?.focus(),50);
}
function saveEditNote(idx){
  const val=document.getElementById("edit-note-"+idx)?.value?.trim();
  if(!val){ notif("Anotação não pode ser vazia","#E05C5C"); return; }
  S.notes[idx].text=val;
  S.notes[idx].edited=new Date().toISOString();
  S.editingNoteIdx=null;
  saveData();
  notif("Anotação atualizada ✓");
  render();
}

// ROADMAP
// ══════════════════════════════════════════════
function renderHeatmap(){
  const data=getActivityData();
  const entries=Object.entries(data);
  const maxVal=Math.max(...Object.values(data),1);
  const weeks=[];
  for(let i=0;i<entries.length;i+=7) weeks.push(entries.slice(i,i+7));
  const dayLabels=["D","S","T","Q","Q","S","S"];

  return `<div style="margin-bottom:24px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div style="font-family:monospace;font-size:10px;color:#555;letter-spacing:1px">ATIVIDADE — ÚLTIMOS 35 DIAS</div>
      <div style="font-family:monospace;font-size:10px;color:#C9A84C">🔥 ${globalStreak()} dias seguidos</div>
    </div>
    <div style="display:flex;gap:4px;align-items:flex-start">
      <div style="display:flex;flex-direction:column;gap:3px;margin-right:2px">
        ${dayLabels.map(l=>`<div style="font-size:9px;color:#333;font-family:monospace;height:14px;line-height:14px">${l}</div>`).join("")}
      </div>
      ${weeks.map(week=>`
        <div style="display:flex;flex-direction:column;gap:3px">
          ${week.map(([date,count])=>{
            const intensity=count===0?0:Math.max(0.15,count/maxVal);
            const bg=count===0?"#0e0e1c":`rgba(201,168,76,${intensity})`;
            const border=count===0?"#1a1a2e":"#C9A84C44";
            const d=new Date(date+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
            return `<div title="${d}: ${count} sessão(ões)"
              style="width:14px;height:14px;border-radius:3px;background:${bg};border:1px solid ${border};cursor:default"></div>`;
          }).join("")}
        </div>
      `).join("")}
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-top:8px;justify-content:flex-end">
      <span style="font-size:10px;color:#333;font-family:monospace">menos</span>
      ${[0,.25,.5,.75,1].map(v=>`<div style="width:12px;height:12px;border-radius:2px;background:${v===0?"#0e0e1c":`rgba(201,168,76,${v})`};border:1px solid ${v===0?"#1a1a2e":"#C9A84C44"}"></div>`).join("")}
      <span style="font-size:10px;color:#333;font-family:monospace">mais</span>
    </div>
  </div>`;
}

function renderRoadmap(){
  const total=S.history.length;
  const xpTotal=S.totalXP;
  const avgScore=S.history.filter(h=>h.score!=null).reduce((s,h,_,a)=>s+h.score/a.length,0)||0;

  return `
    <div style="font-weight:800;font-size:22px;margin-bottom:4px">Roadmap</div>
    <div style="color:#666;font-size:13px;margin-bottom:24px">Seu histórico de aprendizado</div>

    ${renderHeatmap()}

    <div class="stats3">
      <div class="stat"><div class="stat-n" style="color:#C9A84C">${total}</div><div class="stat-l">SESSÕES</div></div>
      <div class="stat"><div class="stat-n" style="color:#5B8CFF">${fmt(xpTotal)}</div><div class="stat-l">XP TOTAL</div></div>
      <div class="stat"><div class="stat-n" style="color:#5dba7d">${Math.round(avgScore)}</div><div class="stat-l">SCORE MÉDIO</div></div>
    </div>

    <div style="font-family:monospace;font-size:10px;color:#555;letter-spacing:1px;margin-bottom:14px">PROGRESSO POR TRILHA</div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:28px">
      ${TRACKS.filter(t=>t.active).map(t=>{
        const s=S.stats[t.id]||DEF_STATS();
        const sessions=(S.history||[]).filter(h=>h.trackId===t.id).length;
        const pct=Math.min((s.xp/s.xpNext)*100,100);
        return `<div class="card" style="border-color:${h(t.color,.18)}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div style="display:flex;align-items:center;gap:10px">
              <span style="font-size:20px">${t.icon}</span>
              <div>
                <div style="font-weight:700;font-size:14px">${t.name}</div>
                <div style="font-size:11px;color:#666">${sessions} sessões${s.streak>0?" · 🔥"+s.streak+" streak":""}</div>
              </div>
            </div>
            <span style="font-size:10px;font-family:monospace;color:${t.color};background:${h(t.color,.1)};border:1px solid ${h(t.color,.2)};padding:2px 8px;border-radius:99px">LVL ${s.level}</span>
          </div>
          <div class="xpbar"><div class="xpfill" style="width:${pct}%;background:${t.color}"></div></div>
          <div class="xprow"><span>${s.xp}/${s.xpNext} XP</span><span>${Math.round(pct)}%</span></div>
        </div>`;
      }).join("")}
    </div>

    <div style="font-family:monospace;font-size:10px;color:#555;letter-spacing:1px;margin-bottom:16px">HISTÓRICO</div>
    ${!S.history.length
      ?`<div style="text-align:center;color:#333;font-size:13px;padding:40px">Nenhuma sessão ainda. Comece a estudar!</div>`
      :`<div class="tl">
        ${S.history.slice(0,40).map(item=>{
          const t=trackById(item.trackId);
          const mInfo=modeById(item.mode)||{label:item.mode};
          const italiaSubInfo=ITALIA_SUBS.find(s=>s.id===item.trackId);
          return `<div class="tl-item">
            <div class="tl-dot" style="border-color:${t?.color||"#555"};background:${h(t?.color||"#555",.15)}"></div>
            <div class="tl-date">${fmtDate(item.date)}</div>
            <div class="tl-card" style="border-color:${h(t?.color||"#555",.12)}">
              <div class="tl-title">${italiaSubInfo?`🇮🇹 Italia › ${italiaSubInfo.name}`:t?.icon||""} ${italiaSubInfo?"":item.trackName+" ·"} ${mInfo.label}</div>
              <div class="tl-meta">+${item.xp} XP${item.score!=null?" · score "+item.score+"/100":""} ${item.topic?"· "+item.topic:""}</div>
              ${item.note?`<div class="tl-note">"${item.note}"</div>`:""}
            </div>
          </div>`;
        }).join("")}
      </div>`}`;
}

// ANALYSIS
// ══════════════════════════════════════════════
function renderAnalysis(){
  return `
    <div style="font-weight:800;font-size:22px;margin-bottom:4px">Análise de Aprendizado</div>
    <div style="color:#666;font-size:13px;margin-bottom:24px">A IA analisa seu histórico e recomenda os próximos passos</div>

    ${!hasAI()?`<div style="background:#E05C5C0a;border:1px solid #E05C5C33;border-radius:12px;padding:16px;margin-bottom:20px;font-size:13px;color:#888">
      Configure a API em <button class="btn-ghost" style="font-size:12px;padding:3px 8px;display:inline" onclick="go('settings')">Configurações</button> para usar esta função.
    </div>`:""}

    ${S.analysisText?`
      <div class="chunk">${mdToHtml(S.analysisText)}</div>
      <button class="btn-ghost btn-full" style="margin-top:12px" onclick="S.analysisText='';render()">Nova análise</button>
    `:`
      <div style="color:#666;font-size:13px;line-height:1.7;margin-bottom:20px">
        Com base nas suas ${S.history.length} sessões registradas, a IA vai identificar padrões, pontos fortes, lacunas e recomendar o que estudar a seguir.
      </div>
      <button class="btn btn-primary btn-full" style="background:#C9A84C;${S.analysisLoading||!hasAI()||!S.history.length?"opacity:.4":""}"
        ${S.analysisLoading||!hasAI()||!S.history.length?"disabled":""}
        onclick="runAnalysis()">
        ${S.analysisLoading?`<span class="spin" style="border-top-color:#08080f"></span> Analisando...`:"🔍 Analisar meu aprendizado"}
      </button>
      ${!S.history.length?`<div style="color:#444;font-size:12px;text-align:center;margin-top:10px">Complete algumas sessões primeiro</div>`:""}
    `}`;
}
async function runAnalysis(){
  S.analysisLoading=true; render();
  try{
    const activeStats=TRACKS.filter(t=>t.active&&t.id!=="italia").map(t=>`${t.name}: LVL ${S.stats[t.id]?.level||1}, streak ${S.stats[t.id]?.streak||0}`);
    const italiaStats=ITALIA_SUBS.map(s=>`Italia › ${s.name}: LVL ${S.stats[s.id]?.level||1}, Italianità ${Math.round(italiaScore())}%`);
    const stats=[...activeStats,...italiaStats].join("\n");
    const hist=S.history.slice(0,60).map(h=>{
      const score=h.score!=null?` score:${h.score}/100`:"";
      const note=h.note?` nota:"${h.note}"` :"";
      return `${h.date.slice(0,10)}: ${h.trackName} (${h.mode})${score}${note}${h.topic?" tópico:"+h.topic:""}`;
    }).join("\n");
    const weakTopics=S.history.filter(h=>h.score!=null&&h.score<60).map(h=>h.topic).filter(Boolean).join(", ");

    S.analysisText=await ai([{role:"user",content:`Analise o histórico de aprendizado e forneça um relatório personalizado:

**Estatísticas:**
${stats}
${weakTopics?"\n**Tópicos com baixo score:** "+weakTopics:""}

**Histórico recente:**
${hist}

Estruture assim:
## Resumo do progresso
[o que está indo bem]

## Lacunas identificadas
[onde há fraquezas, repetições, falta de prática]

## Recomendações para as próximas sessões
[lista específica de 3-5 ações concretas]

## Dica personalizada
[algo específico baseado no padrão observado]

Seja específico, honesto e útil.`}],"",8000);
  }catch(e){ S.analysisText="Erro: "+e.message; }
  S.analysisLoading=false; render();
}

function saveKey(storageKey,inputId,name){
  const v=document.getElementById(inputId)?.value?.trim();
  if(v){ sl(storageKey,v); notif(`${name} salva ✓`); render(); }
}
function clearKey(k){ sl(k,""); notif("Chave removida","#5b8cff"); render(); }
function saveGH(){
  const t=document.getElementById("in-github")?.value?.trim();
  const r=document.getElementById("in-repo")?.value?.trim();
  if(t) sl("sh_github",t);
  if(r) sl("sh_repo",r);
  notif("GitHub configurado ✓"); render();
}
async function resetAll(){
  if(!confirm("Tem certeza? Todo o progresso será apagado.")) return;
  S.stats={tp:DEF_STATS(),sql:DEF_STATS(),es:DEF_STATS()};
  S.totalXP=0; S.history=[]; S.seen={};
  await saveData(); notif("Progresso resetado","#E05C5C"); render();
}

function attachAll(){
  // Challenge textarea live update
  const chTa=document.getElementById("ch-ans");
  if(chTa) chTa.addEventListener("input",()=>{
    S.chAnswer=chTa.value;
    const btn=chTa.nextElementSibling;
    if(btn){ btn.disabled=!S.chAnswer.trim(); btn.style.background=S.chAnswer.trim()?S.track?.color:"#1a1a2e"; }
  });
  // Dictado textarea
  const dtTa=document.getElementById("dictado-in");
  if(dtTa) dtTa.addEventListener("input",()=>{
    const btn=dtTa.nextElementSibling;
    if(btn){ btn.disabled=!dtTa.value.trim(); }
  });
  // Scroll chat
  setTimeout(()=>{ const el=document.getElementById("chat-msgs"); if(el) el.scrollTop=el.scrollHeight; },50);
}
