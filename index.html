<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>StudyHub · Felipe</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:#060610;color:#eee;font-family:'Syne',sans-serif}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#1e1e2e;border-radius:99px}
input,textarea,button{font-family:'Syne',sans-serif}

/* ── LAYOUT ── */
.grid-bg{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#12122011 1px,transparent 1px),linear-gradient(90deg,#12122011 1px,transparent 1px);background-size:36px 36px}
#root{min-height:100vh;padding:24px 18px 40px}
.container{max-width:680px;margin:0 auto;position:relative}

/* ── NAV ── */
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;cursor:pointer}
.logo span{color:#C9A84C}
.nav-links{display:flex;gap:6px}
.nav-btn{background:none;border:1px solid #1e1e2e;border-radius:8px;padding:6px 12px;color:#888;font-size:12px;cursor:pointer;transition:all .2s}
.nav-btn:hover,.nav-btn.active{border-color:#C9A84C44;color:#C9A84C;background:#C9A84C0a}

/* ── SECTION TITLES ── */
.sec-label{font-family:monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#666;margin-bottom:12px}
.sec-label.dim{color:#3a3a50}
.page-title{font-weight:800;font-size:22px;margin-bottom:6px}
.page-sub{color:#888;font-size:13px;margin-bottom:24px}

/* ── CARDS ── */
.card{background:#0c0c18;border-radius:14px;padding:18px;border:1px solid #1a1a28;transition:all .2s}
.card.clickable{cursor:pointer}
.card.clickable:hover{transform:translateY(-2px)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:11px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:11px}

/* ── XP BAR ── */
.xp-bar-wrap{width:100%;height:5px;background:#111122;border-radius:99px;overflow:hidden;margin-top:12px}
.xp-bar-fill{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.34,1.56,.64,1)}
.xp-row{display:flex;justify-content:space-between;margin-top:5px;font-family:monospace;font-size:10px;color:#777}
.streak{color:#ff9f43}
.badge{font-size:10px;font-family:monospace;padding:2px 7px;border-radius:99px}

/* ── BUTTONS ── */
.btn{border:none;border-radius:10px;padding:11px 18px;cursor:pointer;font-weight:700;font-size:14px;transition:all .2s}
.btn-primary{color:#08080f}
.btn-ghost{background:none;border:1px solid #2a2a3e;color:#888;border-radius:10px;padding:9px 16px;cursor:pointer;font-size:13px;transition:all .2s}
.btn-ghost:hover{border-color:#444;color:#aaa}
.btn-full{width:100%}
.btn:disabled{opacity:.4;cursor:default}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-overlay.open{display:flex}
.modal-box{background:#090914;border-radius:18px;width:100%;max-width:540px;max-height:92vh;overflow-y:auto}
.modal-header{padding:16px 20px;border-bottom:1px solid #ffffff08;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;color:#444;font-size:22px;cursor:pointer;line-height:1}
.modal-body{padding:20px}

/* ── FORMS ── */
.form-group{margin-bottom:16px}
.form-label{font-size:12px;color:#999;margin-bottom:6px;display:block;font-family:monospace}
.form-input{width:100%;background:#0e0e1c;border:1px solid #2a2a3e;border-radius:10px;padding:11px 14px;color:#eee;font-size:13px;outline:none;transition:border-color .2s}
.form-input:focus{border-color:#C9A84C44}
.form-textarea{width:100%;background:#0e0e1c;border:1px solid #2a2a3e;border-radius:10px;padding:11px 14px;color:#eee;font-size:13px;resize:vertical;outline:none;min-height:80px}
.form-textarea:focus{border-color:#C9A84C44}

/* ── NOTIF ── */
#notif{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:9px 22px;border-radius:99px;font-family:monospace;font-size:13px;z-index:200;white-space:nowrap;display:none;background:#0c0c18;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── LOADING ── */
#loading{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:monospace;color:#333;font-size:13px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #1e1e2e;border-top-color:#C9A84C;border-radius:50%;animation:spin .8s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── SESSION ── */
.session-type-btn{background:#0e0e1c;border-radius:12px;padding:13px 16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all .2s;color:#ccc;border:1px solid #1e1e2e;margin-bottom:9px;width:100%}
.session-type-btn:hover{background:#ffffff06}
.question-text{font-weight:700;font-size:15px;color:#eee;margin-bottom:18px;line-height:1.6}
.options{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.option-btn{border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;font-size:13px;border:1px solid #2a2a3e;background:#0e0e1c;color:#ddd;transition:all .2s;width:100%}
.option-btn:hover:not(:disabled){background:#ffffff06}
.option-btn.selected{color:#fff}
.option-btn.correct{background:#0f2010!important;border-color:#3a8a3a!important;color:#7dd87d!important}
.option-btn.wrong{background:#20100e!important;border-color:#8a3a3a!important;color:#d87d7d!important}
.feedback-box{border-radius:12px;padding:16px;margin-top:12px}
.feedback-box.ok{background:#0f2010;border:1px solid #3a8a3a44}
.feedback-box.fail{background:#20100e;border:1px solid #8a3a3a44}
.tip-box{background:#15130a;border:1px solid #C9A84C33;border-radius:10px;padding:9px 13px;margin-bottom:12px;font-size:12px;color:#C9A84C99}
.flashcard-wrap{perspective:1000px;height:190px;margin-bottom:14px;cursor:pointer}
.flashcard-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s ease}
.flashcard-inner.flipped{transform:rotateY(180deg)}
.flashcard-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;justify-content:center;padding:22px}
.flashcard-back{transform:rotateY(180deg)}
.f-label{font-size:10px;font-family:monospace;letter-spacing:1px;margin-bottom:10px}
.f-content{font-weight:700;font-size:16px;color:#eee;text-align:center;line-height:1.4}
.f-hint{margin-top:12px;font-size:10px;color:#666;text-align:center}
.f-back-text{color:#ddd;font-size:13px;line-height:1.8}
.challenge-box{border-radius:12px;padding:15px;margin-bottom:14px}
.solution-box{background:#0e0e1c;border:1px solid #2a2a3e;border-radius:12px;padding:16px}
.solution-text{color:#bbb;font-size:13px;line-height:1.8;white-space:pre-wrap;margin-bottom:14px}

/* ── AI LEARN MODES ── */
.learn-chunk{background:#0e0e1c;border:1px solid #2a2a3e;border-radius:12px;padding:16px;margin-bottom:12px;font-size:14px;color:#ddd;line-height:1.8}
.learn-chunk h3{color:#eee;font-size:15px;margin-bottom:8px}
.chat-messages{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;max-height:340px;overflow-y:auto}
.chat-msg{padding:12px 15px;border-radius:12px;font-size:13px;line-height:1.7;max-width:90%}
.chat-msg.user{background:#1a1a2e;color:#ddd;align-self:flex-end;border:1px solid #2a2a4e}
.chat-msg.ai{background:#0e0e1c;color:#ddd;align-self:flex-start;border:1px solid #1e1e2e}
.chat-input-row{display:flex;gap:8px}
.chat-input{flex:1;background:#0e0e1c;border:1px solid #2a2a3e;border-radius:10px;padding:10px 13px;color:#eee;font-size:13px;outline:none}
.chat-send{background:#C9A84C;border:none;border-radius:10px;padding:10px 16px;cursor:pointer;color:#08080f;font-weight:700;font-size:13px}

/* ── ROADMAP ── */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:1px;background:#1e1e2e}
.timeline-item{position:relative;margin-bottom:20px}
.timeline-dot{position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;border:2px solid #1e1e2e;background:#060610}
.timeline-date{font-family:monospace;font-size:10px;color:#777;margin-bottom:4px}
.timeline-content{background:#0c0c18;border:1px solid #252535;border-radius:12px;padding:14px}
.timeline-title{font-weight:700;font-size:13px;margin-bottom:4px}
.timeline-meta{font-size:12px;color:#888}
.timeline-note{font-size:12px;color:#999;margin-top:8px;font-style:italic;border-top:1px solid #1a1a28;padding-top:8px}

/* ── STATS ── */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat-box{background:#0c0c18;border:1px solid #1a1a28;border-radius:12px;padding:14px;text-align:center}
.stat-val{font-weight:800;font-size:22px;margin-bottom:2px}
.stat-lbl{font-family:monospace;font-size:10px;color:#777}

/* ── SETUP ── */
.setup-box{background:#0c0c18;border:1px solid #C9A84C22;border-radius:16px;padding:24px;max-width:480px;margin:0 auto}
.setup-title{font-weight:800;font-size:20px;margin-bottom:6px}
.setup-sub{color:#555;font-size:13px;margin-bottom:24px;line-height:1.6}
.setup-step{display:flex;gap:12px;margin-bottom:16px;align-items:flex-start}
.setup-num{width:24px;height:24px;border-radius:50%;background:#C9A84C18;border:1px solid #C9A84C44;color:#C9A84C;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}

/* ── ANALYSIS ── */
.analysis-box{background:#0e0e1c;border:1px solid #2a2a3e;border-radius:12px;padding:16px;margin-bottom:12px;font-size:13px;color:#ddd;line-height:1.8}
.analysis-box h3{color:#eee;font-size:14px;font-weight:700;margin-bottom:8px}

/* ── FILE UPLOAD ── */
.upload-area{border:1px dashed #2a2a3e;border-radius:12px;padding:24px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:14px}
.upload-area:hover{border-color:#C9A84C44;background:#C9A84C06}
.upload-area input{display:none}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div id="notif"></div>
<div id="loading"><span class="spinner"></span>carregando...</div>
<div id="root" style="display:none"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// CONTENT BANK
// ═══════════════════════════════════════════════════════════════
const STATIC_CONTENT = {
  tp:{
    quiz:[
      {q:"Qual método compara o preço de uma transação controlada com transações entre partes independentes?",opts:["A) PRL","B) PCI (Preço Comparável Independente)","C) CPL","D) PVEx"],ans:"B",exp:"O PCI (CUP na OCDE) é o método preferido quando há comparáveis confiáveis — compara diretamente o preço da transação controlada com o de transações similares entre partes independentes."},
      {q:"Qual princípio fundamental norteia as regras de Transfer Pricing globalmente?",opts:["A) Princípio da Consolidação Fiscal","B) Arm's Length (Plena Concorrência)","C) Princípio da Proporcionalidade","D) Princípio da Territorialidade"],ans:"B",exp:"O Arm's Length Principle determina que transações entre relacionadas devem ser precificadas como entre partes independentes em condições de mercado. Base do Artigo 9 do modelo OCDE."},
      {q:"O método CPL é mais adequado para qual tipo de transação?",opts:["A) Distribuição de produtos acabados","B) Serviços de alto valor agregado","C) Fabricação de produtos semi-acabados ou commodities","D) Licenciamento de PI"],ans:"C",exp:"CPL parte do custo de produção e adiciona margem comparável. Ideal para fabricantes que agregam valor no processo produtivo, especialmente semi-acabados e commodities."},
      {q:"O que é o 'arm's length range'?",opts:["A) Preço médio do setor","B) Conjunto de valores resultantes da aplicação do método a múltiplos comparáveis","C) Intervalo aceito pela Receita sem ajuste","D) Diferença entre preço mínimo e máximo"],ans:"B",exp:"O intervalo de plena concorrência reúne os resultados do método aplicado a vários comparáveis. Se o resultado da transação controlada cair dentro do intervalo, está em conformidade."},
      {q:"Qual método é mais indicado para distribuidores de baixo risco?",opts:["A) CUP/PCI","B) Cost Plus/CPL","C) Resale Price/PRL","D) Profit Split"],ans:"C",exp:"PRL parte do preço de revenda e subtrai margem bruta comparável. Perfeito para distribuidores que não agregam valor significativo ao produto, apenas o revendem."},
      {q:"O que é 'delineation' de uma transação controlada?",opts:["A) Documentar preços em formulário fiscal","B) Identificar e delimitar a transação real com base na conduta efetiva das partes","C) Calcular o ajuste de preço","D) Registrar no SPED"],ans:"B",exp:"Delineamento é entender a transação real: o que foi transferido, quais riscos cada parte assumiu, e se a forma contratual reflete a substância econômica."},
    ],
    flashcard:[
      {front:"Método PCI",back:"Compara o preço da transação controlada com transações comparáveis entre partes independentes. Método preferido da OCDE quando há comparáveis confiáveis.",tip:"Equivalente ao CUP (Comparable Uncontrolled Price) na nomenclatura internacional."},
      {front:"Análise Funcional (FAR)",back:"Mapeamento de Funções exercidas, Ativos utilizados e Riscos assumidos por cada parte. Base para escolher o método de TP e identificar a tested party.",tip:"FAR = Functions, Assets, Risks. É o ponto de partida de qualquer análise de TP."},
      {front:"DEMPE",back:"Development, Enhancement, Maintenance, Protection, Exploitation — framework OCDE para intangíveis. Define quem deve receber os retornos com base em quem realmente executa cada atividade.",tip:"Essencial para transações de royalties e propriedade intelectual."},
      {front:"Tested Party",back:"A entidade menos complexa sobre a qual o método é aplicado. Geralmente realiza funções rotineiras e assume menos riscos — mais fácil de encontrar comparáveis.",tip:"Costuma ser a entidade nacional em casos de distribuidora ou fabricante por contrato."},
      {front:"IQR (Intervalo Interquartil)",back:"Intervalo entre Q1 (25%) e Q3 (75%) dos comparáveis. Usado como arm's length range após eliminar outliers. Resultado fora do IQR → ajuste necessário.",tip:"A mediana (Q2) é o ponto de referência central preferido para ajustes."},
    ],
    challenge:[
      {title:"Seleção de Método",scenario:"Alfa Ltda. importa componentes da controladora americana para montagem simples no Brasil. Sem P&D. Existem comparáveis de preço disponíveis no mercado.",task:"Qual método é mais adequado? Justifique.",hint:"Pense nas funções da Alfa (montagem simples) e disponibilidade de comparáveis.",solution:"PCI é preferido se houver comparáveis de preço confiáveis. Sem eles, CPL — aplica-se margem sobre o custo da controladora fabricante. PRL seria adequado se analisássemos a revenda ao cliente final."},
      {title:"IQR na prática",scenario:"8 comparáveis com margens: 18%, 22%, 24%, 25%, 27%, 29%, 31%, 45%. Empresa testada pratica 20%.",task:"Calcule o IQR. A margem de 20% está em conformidade?",hint:"Q1 = média do 2º e 3º valor. Q3 = média do 6º e 7º valor.",solution:"Ordenados: 18,22,24,25,27,29,31,45\nQ1=(22+24)/2=23% | Q3=(29+31)/2=30%\nIQR: 23% a 30%\n\n20% está FORA do intervalo (abaixo de Q1) → ajuste necessário."},
      {title:"Análise FAR",scenario:"Subsidiária brasileira: desenvolve software localmente, detém marcas no Brasil, assume risco de crédito e gerencia operação comercial no país.",task:"Liste as principais Funções, Ativos e Riscos (FAR) da subsidiária.",hint:"Seja específico em cada categoria — evite respostas genéricas.",solution:"Funções: desenvolvimento de software, vendas/marketing, gestão de clientes, suporte técnico.\n\nAtivos: marcas registradas no Brasil, código-fonte local, carteira de clientes, know-how de mercado.\n\nRiscos: crédito (inadimplência), mercado (câmbio, concorrência), operacional."},
    ],
  },
  sql:{
    quiz:[
      {q:"Qual cláusula filtra resultados APÓS o GROUP BY?",opts:["A) WHERE","B) FILTER","C) HAVING","D) LIMIT"],ans:"C",exp:"HAVING filtra grupos após a agregação. WHERE filtra linhas antes. Ex: GROUP BY dept HAVING COUNT(*) > 5."},
      {q:"Qual JOIN retorna apenas linhas com correspondência em ambas as tabelas?",opts:["A) LEFT JOIN","B) FULL OUTER JOIN","C) INNER JOIN","D) CROSS JOIN"],ans:"C",exp:"INNER JOIN exclui linhas sem par na outra tabela. É o JOIN mais restritivo e o padrão quando não especificado em muitos bancos."},
      {q:"Para que serve PARTITION BY em window functions?",opts:["A) Divide a tabela fisicamente","B) Define grupos para o cálculo sem colapsar linhas","C) Substitui GROUP BY","D) Filtra linhas do cálculo"],ans:"B",exp:"PARTITION BY divide logicamente o resultado para cálculo da window function, mas mantém todas as linhas — diferente do GROUP BY que colapsa."},
      {q:"O que é um CTE?",opts:["A) Índice especial","B) Tabela temporária persistida","C) Resultado nomeado e temporário definido com WITH","D) Função que retorna tabela"],ans:"C",exp:"CTEs (WITH nome AS (...)) criam resultados temporários nomeados referenciáveis na query principal. Melhoram legibilidade e permitem recursão."},
      {q:"Qual a diferença entre UNION e UNION ALL?",opts:["A) São sinônimos","B) UNION remove duplicatas; UNION ALL mantém tudo","C) UNION ALL remove duplicatas","D) UNION só funciona com SELECT *"],ans:"B",exp:"UNION faz DISTINCT implícito (mais lento). UNION ALL concatena diretamente sem remover duplicatas (mais rápido). Prefira UNION ALL quando não há duplicatas."},
    ],
    flashcard:[
      {front:"LEFT JOIN vs INNER JOIN",back:"INNER JOIN: só linhas com par em ambas as tabelas.\nLEFT JOIN: todas as linhas da esquerda + pares da direita (NULL onde não há match).",tip:"'Quero tudo da esquerda mesmo sem par' → LEFT JOIN."},
      {front:"Window Functions",back:"Calculam sobre linhas relacionadas sem colapsar o resultado. Sintaxe: FN() OVER (PARTITION BY col ORDER BY col).\nExemplos: ROW_NUMBER(), RANK(), LAG(), LEAD(), SUM() OVER.",tip:"Diferença chave: GROUP BY colapsa linhas, window functions não."},
      {front:"NULL em SQL",back:"NULL = ausência de valor. Comparações: IS NULL / IS NOT NULL (nunca = NULL).\nCOALESCE(col, 'padrão') substitui NULL.",tip:"NULL = NULL retorna NULL, não TRUE. Pegadinha clássica em JOINs e WHERE."},
      {front:"EXPLAIN / EXPLAIN ANALYZE",back:"EXPLAIN: plano estimado de execução.\nEXPLAIN ANALYZE: executa e mostra dados reais.\nIdentifica full scans, sorts caros, nested loops ineficientes.",tip:"Nunca otimize no escuro — sempre EXPLAIN primeiro."},
    ],
    challenge:[
      {title:"Relatório por Região",scenario:"Tabela 'vendas' (id, data, regiao, valor, status). Quer total vendido por região, só status='aprovado', maior para menor.",task:"Escreva a query completa.",hint:"SELECT, FROM, WHERE, GROUP BY, ORDER BY, SUM().",solution:"SELECT regiao, SUM(valor) AS total_vendas\nFROM vendas\nWHERE status = 'aprovado'\nGROUP BY regiao\nORDER BY total_vendas DESC;"},
      {title:"Clientes sem Compra Recente",scenario:"Tabelas 'clientes' (id, nome, email) e 'pedidos' (id, cliente_id, data_pedido). Quer clientes sem pedido nos últimos 90 dias ou nunca compraram.",task:"Query com LEFT JOIN.",hint:"Filtre a data no ON do JOIN, não no WHERE. WHERE p.id IS NULL.",solution:"SELECT c.id, c.nome, c.email\nFROM clientes c\nLEFT JOIN pedidos p\n  ON c.id = p.cliente_id\n  AND p.data_pedido >= CURRENT_DATE - INTERVAL '90 days'\nWHERE p.id IS NULL;"},
    ],
  },
  es:{
    quiz:[
      {q:"¿Conjugación de 'hablar' en primera persona del pretérito indefinido?",opts:["A) hablaba","B) hablaré","C) hablé","D) hablo"],ans:"C",exp:"'Hablé' é o pretérito indefinido (passado perfeito simples). 'Hablaba' é imperfecto, 'hablaré' é futuro, 'hablo' é presente."},
      {q:"¿Apertura más adecuada para email formal en español?",opts:["A) ¡Hola! ¿Qué tal?","B) Estimado/a Sr./Sra. [apellido]:","C) Buenas, te escribo...","D) Oye, necesito algo."],ans:"B",exp:"'Estimado/a' = 'Prezado/a'. É o tratamento padrão em comunicações formais de negócios em espanhol."},
      {q:"¿Cómo se dice 'transfer pricing' en español técnico?",opts:["A) Transferencia de precios","B) Precios de transferencia","C) Precio de traslado","D) Valuación de transferencia"],ans:"B",exp:"'Precios de transferencia' é o termo técnico oficial em toda documentação fiscal e tributária em espanhol."},
      {q:"¿Cuál es el plural correcto de 'el análisis'?",opts:["A) los análisises","B) los análisis","C) los análisas","D) los analisas"],ans:"B",exp:"Palavras terminadas em '-s' não mudam no plural: el análisis → los análisis. Mesmo padrão: la crisis → las crisis."},
    ],
    flashcard:[
      {front:"Ser vs Estar",back:"SER: identidade, origem, características permanentes, profissão.\nESTAR: estados temporários, localização, condições.\n\nEx: soy analista (ser) / estoy cansado (estar).",tip:"'Estar' para estados/emoções; 'ser' para identidade. Há exceções."},
      {front:"Vocabulário de Reuniões",back:"la reunión · el orden del día (pauta) · el acta (ata) · el informe (relatório) · el plazo (prazo) · el presupuesto (orçamento) · pendiente (pendente)",tip:"Muitas palavras são cognatas — confie na similaridade com o português."},
      {front:"Discordar com Educação",back:"Entiendo tu punto, sin embargo...\nCon todo respeto, creo que...\nQuizás podríamos considerar...\nNo estoy del todo de acuerdo...",tip:"No mundo de negócios, a forma importa tanto quanto o conteúdo."},

// STORAGE — GitHub + localStorage
// ═══════════════════════════════════════════════════════════════
function getLocal(k){try{return localStorage.getItem(k)}catch{return null}}
function setLocal(k,v){try{localStorage.setItem(k,v)}catch{}}

function getKeys(){
  return {
    gemini:  getLocal("sh_gemini_key")||"",
    github:  getLocal("sh_github_token")||"",
    repo:    getLocal("sh_github_repo")||"felipeperucci/studyhub",
  };
}

async function githubRead(){
  const {github,repo} = getKeys();
  if(!github) return null;
  try{
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/data.json`,{
      headers:{Authorization:`token ${github}`,Accept:"application/vnd.github.v3+json"}
    });
    if(!r.ok) return null;
    const j = await r.json();
    return {data:JSON.parse(atob(j.content)), sha:j.sha};
  }catch{return null}
}

async function githubWrite(data, sha){
  const {github,repo} = getKeys();
  if(!github) return false;
  try{
    const body = {message:"StudyHub sync",content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2)))),sha};
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/data.json`,{
      method:"PUT",
      headers:{Authorization:`token ${github}`,Accept:"application/vnd.github.v3+json","Content-Type":"application/json"},
      body:JSON.stringify(body)
    });
    return r.ok;
  }catch{return false}
}

let _ghSha = null;

async function loadData(){
  // Try GitHub first
  const gh = await githubRead();
  if(gh){
    _ghSha = gh.sha;
    const d = gh.data;
    if(d.stats) S.stats = d.stats;
    if(typeof d.totalXP==="number") S.totalXP = d.totalXP;
    if(d.history) S.history = d.history;
    return;
  }
  // Fallback: localStorage
  try{
    const saved = getLocal("sh_data");
    if(saved){
      const d = JSON.parse(saved);
      if(d.stats) S.stats = d.stats;
      if(typeof d.totalXP==="number") S.totalXP = d.totalXP;
      if(d.history) S.history = d.history;
    }
  }catch{}
}

async function saveData(){
  const data = {stats:S.stats, totalXP:S.totalXP, history:S.history};
  // Always save locally as fallback
  setLocal("sh_data", JSON.stringify(data));
  // Try GitHub
  const ok = await githubWrite(data, _ghSha);
  if(ok){
    // refresh sha
    const gh = await githubRead();
    if(gh) _ghSha = gh.sha;
  }
}

// ═══════════════════════════════════════════════════════════════
// AI — Google Gemini API
// ═══════════════════════════════════════════════════════════════
async function callAI(messages, system="", maxTokens=1000){
  const {gemini} = getKeys();
  if(!gemini) throw new Error("API key do Gemini não configurada. Va em Configuracoes.");

  // Convert to Gemini format
  const raw = messages.map(m=>({
    role: m.role === "assistant" ? "model" : "user",
    text: m.content
  }));

  // Gemini requires strict user/model alternation — merge consecutive same-role messages
  const merged = [];
  for(const msg of raw){
    if(merged.length > 0 && merged[merged.length-1].role === msg.role){
      merged[merged.length-1].text += "\n" + msg.text;
    } else {
      merged.push({role: msg.role, text: msg.text});
    }
  }

  // Must start with user
  if(merged.length === 0 || merged[0].role !== "user"){
    merged.unshift({role:"user", text:"Ola"});
  }

  const geminiMessages = merged.map(m=>({role:m.role, parts:[{text:m.text}]}));

  const body = {
    contents: geminiMessages,
    generationConfig: {maxOutputTokens: maxTokens, temperature: 0.7},
  };
  if(system) body.systemInstruction = {parts:[{text: system}]};

  const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-goog-api-key": gemini},
    body:JSON.stringify(body)
  });
  const j = await r.json();
  if(j.error) throw new Error(j.error.message);
  return j.candidates?.[0]?.content?.parts?.[0]?.text || "";
}

async function callAIJson(messages, system="", maxTokens=1500){
  const raw = await callAI(messages, system, maxTokens);
  // Strip markdown code fences
  const cleaned = raw.replace(/```(?:json)?\s*/gi, "").replace(/```/g, "").trim();
  // Find the outermost JSON object or array
  const objMatch = cleaned.match(/\{[\s\S]*\}/);
  const arrMatch = cleaned.match(/\[[\s\S]*\]/);
  const match = objMatch && arrMatch
    ? (cleaned.indexOf("{") < cleaned.indexOf("[") ? objMatch : arrMatch)
    : (objMatch || arrMatch);
  if(!match) throw new Error("IA não retornou JSON válido. Tente novamente.");
  try {
    return JSON.parse(match[0]);
  } catch(e) {
    throw new Error("Erro ao processar resposta da IA. Tente novamente.");
  }
}

  S.sessionMode="practice";
  S.sessionType=typeId;
  S.selectedOpt=null;S.revealed=false;S.answer="";S.flipped=false;
  const t=S.activeTrack;

  if(hasAIKey()){
    render(); // show loading state
    try{
      const sys=`Você é um tutor especialista em "${t.name}". IMPORTANTE: Responda SOMENTE com o objeto JSON puro. Não use markdown, não use blocos de código, não escreva nada antes ou depois do JSON. Comece sua resposta diretamente com { e termine com }.`;
      const prompts={
        quiz:`Crie UMA pergunta de múltipla escolha de nível intermediário/avançado sobre ${t.name}. Responda APENAS com este JSON (sem mais nada): {"q":"texto da pergunta","opts":["A) opção","B) opção","C) opção","D) opção"],"ans":"A","exp":"explicação detalhada"}`,
        flashcard:`Crie UM flashcard sobre um conceito importante de ${t.name}. Responda APENAS com este JSON (sem mais nada): {"front":"nome do conceito","back":"explicação completa","tip":"dica prática"}`,
        challenge:`Crie UM desafio prático de ${t.name}. Responda APENAS com este JSON (sem mais nada): {"title":"título curto","scenario":"descrição do cenário","task":"o que fazer","hint":"dica","solution":"solução detalhada"}`,
      };
      S.currentItem = await callAIJson([{role:"user",content:prompts[typeId]}], sys, 1500);
    }catch(e){
      // fallback to static
      S.currentItem = pick(STATIC_CONTENT[t.id][typeId]);
      notif("IA falhou: " + e.message.slice(0,60),"#E05C5C");
    }
  } else {
    S.currentItem = pick(STATIC_CONTENT[t.id][typeId]);
  }
  render();
}

async function completeSession(xp, correct){
  const note = document.getElementById("session-note")?.value||"";
  const t=S.activeTrack;
  // Update stats
  const s=S.stats[t.id];
  const newXP=s.xp+xp;
  const leveled=newXP>=s.xpNext;
  S.stats[t.id]={xp:leveled?newXP-s.xpNext:newXP,level:leveled?s.level+1:s.level,xpNext:leveled?Math.round(s.xpNext*1.5):s.xpNext,streak:s.streak+1};
  S.totalXP+=xp;
  // Log history
  S.history.unshift({
    date:new Date().toISOString(),
    trackId:t.id,
    trackName:t.name,
    mode:S.sessionMode,
    type:S.sessionType,
    xp,correct,
    note,
    title:S.currentItem?.title||S.currentItem?.front||S.currentItem?.q?.slice(0,40)||S.sessionType,
  });
  // Reset session
  S.sessionMode=null;S.sessionType=null;S.currentItem=null;S.selectedOpt=null;S.revealed=false;S.answer="";S.flipped=false;
  await saveData();
  if(leveled) notif(`🎉 Level up! ${t.name} chegou ao nível ${S.stats[t.id].level}!`,"#C9A84C");
  else notif(`+${xp} XP ${correct?"— Ótimo! 🎯":"— Continue! 💪"}`,correct?"#5dba7d":"#5b8cff");
  render();
}

async function startLearn(modeId){
  const t=S.activeTrack;
  if(!hasAIKey()&&modeId!=="brief"){
    notif("Configure a API key do Gemini em Configurações","#E05C5C");
    return;
  }
  S.sessionMode="learn";
  S.sessionType=modeId;
  S.chatHistory=[];S.learnChunks=[];S.learnChunkIdx=0;S.docContent="";S.revealed=false;
  render();

  if(modeId==="brief"){
    if(hasAIKey()){
      try{
        const text=await callAI([{role:"user",content:`Gere um "daily brief" curto e prático sobre ${t.name}. Escolha um conceito relevante e explique em 3-4 parágrafos com: 1) o conceito central, 2) um exemplo prático do dia a dia profissional, 3) uma dica de aplicação. Seja direto e útil.`}], "", 2000);
        S.learnChunks=[text];
      }catch{S.learnChunks=["Erro ao gerar brief. Verifique sua API key."];}
    } else {
      S.learnChunks=[`**Daily Brief — ${t.name}**\n\nConfigure a API key do Gemini (grátis) para receber briefs personalizados gerados por IA todo dia.`];
    }
    render();return;
  }

  if(modeId==="guide"){
    try{
      const text=await callAI([{role:"user",content:`Crie uma microaula sobre um tópico relevante de "${t.name}" para um analista júnior. Estruture em exatamente 4 seções separadas pelo marcador ---BLOCO--- entre elas. Cada seção começa com ## seguido do título. Use **negrito** para termos importantes. Seja específico e didático. Formato obrigatório:\n\n## 1. Contexto\n[conteúdo]\n\n---BLOCO---\n\n## 2. O Conceito\n[conteúdo]\n\n---BLOCO---\n\n## 3. Exemplo Prático\n[conteúdo]\n\n---BLOCO---\n\n## 4. Pontos-Chave\n[conteúdo]`}], "", 2000);
      S.learnChunks=text.split("---BLOCO---").map(s=>s.trim()).filter(Boolean);
    }catch(e){notif(e.message,"#E05C5C");}
    render();return;
  }

  if(modeId==="map"){
    try{
      const json=await callAIJson([{role:"user",content:`Crie um mapa de 5 conceitos fundamentais de "${t.name}" em ordem do mais basico ao mais avancado. Responda APENAS com JSON puro sem markdown: {"concepts":[{"title":"nome","level":1,"description":"explicacao","why":"por que aprender"}]}`}]);
      S.learnChunks=json.concepts||[];
    }catch(e){notif(e.message,"#E05C5C");}
    render();return;
  }

  if(modeId==="socratic"){
    try{
      const first=await callAI([{role:"user",content:`Você vai conduzir um diálogo socrático sobre "${t.name}" com um analista em aprendizado. Faça a primeira pergunta aberta para explorar o que ele já sabe sobre o tema. Seja conciso e estimulante.`}], "", 1500);
      S.chatHistory=[{role:"ai",text:first}];
    }catch(e){notif(e.message,"#E05C5C");}
    render();return;
  }

  // doc mode — just render the upload UI
  render();
}

function mdToHtml(text){
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/^## (.+)$/gm,'<h3 style="color:#eee;font-size:15px;margin:14px 0 8px">$1</h3>')
    .replace(/^# (.+)$/gm,'<h2 style="color:#eee;font-size:17px;margin:16px 0 8px">$1</h2>')
    .replace(/^- (.+)$/gm,'<li style="margin:4px 0;color:#ccc">$1</li>')
    .replace(/(<li.*<\/li>)/gs,'<ul style="padding-left:18px;margin:8px 0">$1</ul>')
    .replace(/\n/g,'<br>');
}

  render();

async function sendDocChat(){

async function runAnalysis(){
  S.analysisLoading=true;render();
  try{
    const summary=S.history.slice(0,50).map(h=>`${h.date.slice(0,10)}: ${h.trackName} (${h.type}) +${h.xp}XP${h.correct===false?" ERROU":""}${h.note?" nota: "+h.note:""}`).join("\n");
    const statsStr=TRACKS.filter(t=>t.active).map(t=>`${t.name}: LVL ${S.stats[t.id].level}, ${S.stats[t.id].xp}/${S.stats[t.id].xpNext} XP, streak ${S.stats[t.id].streak}`).join("\n");
    const text=await callAI([{role:"user",content:`Analise o histórico de aprendizado abaixo e forneça:
1. **Resumo do progresso** — o que já foi feito e pontos fortes
2. **Lacunas identificadas** — onde há menos prática ou mais erros
3. **Recomendações concretas** — o que estudar nas próximas sessões e em qual ordem
4. **Dica motivacional** — algo personalizado com base no padrão observado

Estatísticas:
${statsStr}

Histórico recente (mais recente primeiro):
${summary}`}]);
    S.analysisText=text;
  }catch(e){S.analysisText="Erro: "+e.message;}
  S.analysisLoading=false;
  render();
}

function saveGeminiKey(){
  const v=document.getElementById("gemini-key")?.value?.trim();
  if(v){setLocal("sh_gemini_key",v);notif("API key do Gemini salva ✓");render();}
}
function saveGHKey(){
  const t=document.getElementById("gh-token")?.value?.trim();
  const r=document.getElementById("gh-repo")?.value?.trim();
  if(t) setLocal("sh_github_token",t);
  if(r) setLocal("sh_github_repo",r);
  notif("GitHub configurado ✓");render();
}
function clearKey(k){setLocal(k,"");notif("Chave removida","#5b8cff");render()}
async function resetData(){
  if(!confirm("Tem certeza? Todo o progresso será apagado.")) return;
  S.stats=JSON.parse(JSON.stringify(DEFAULT_STATS));
  S.totalXP=0;S.history=[];
  await saveData();notif("Progresso resetado","#E05C5C");render();
}

// HANDLERS
// ═══════════════════════════════════════════════════════════════
function attachHandlers(){
  // Challenge textarea
  const ta=document.getElementById("ch-answer");
  if(ta) ta.addEventListener("input",()=>{
    S.answer=ta.value;
    const btn=ta.nextElementSibling;
    if(btn){btn.disabled=!S.answer.trim();btn.style.background=S.answer.trim()?S.activeTrack.color:"#1a1a28";}
  });
  // Chat enter
  const ci=document.getElementById("chat-in");
  if(ci) ci.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&!e.shiftKey){
      e.preventDefault();
      if(S.sessionType==="socratic") sendSocratic();
      else if(S.sessionType==="doc") sendDocChat();
    }
  });
  // Scroll chat to bottom
  setTimeout(()=>{const el=document.getElementById("chat-msgs");if(el)el.scrollTop=el.scrollHeight;},50);
}

(async()=>{
  await loadData();
  document.getElementById("loading").style.display="none";
  document.getElementById("root").style.display="block";
  render();
})();
</script>
